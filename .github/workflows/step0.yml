name: step0
# Roadmap 第 0 步: test the test writer on post-cutoff SWE-bench-Live/MultiLang tasks.
# write: Claude writes tests for each issue, without the gold data (stripped before the
# agent starts). grade: the tests run on the buggy and the fixed code. summarize: catch rate.
# With writer_runs set, the write job is skipped and grade reuses those runs' writer output.
# An image that does not fit on the runner's disk is excluded_disk (eval/src/disk.ts); the
# runner input picks a bigger runner to try again.

on:
  workflow_dispatch:
    inputs:
      ids:
        description: JSON array of instance ids (empty = all 61)
        default: ""
      max_parallel:
        description: concurrent writer runs (they share one plan quota)
        default: "2"
      model:
        description: writer model (Sonnet saves quota; Opus for the real measurement)
        default: claude-sonnet-5-5
      prompt:
        description: writer prompt version (v2 is eval/src/writer_prompt_v2.md)
        type: choice
        options: [v1, v2]
        default: v1
      mutants:
        description: also grade caught tasks on mutants (the gold patch minus one hunk at a time)
        type: choice
        options: ["false", "true"]
        default: "false"
      runner:
        description: runner for the write and grade jobs (the 16-core one has the disk for the biggest images)
        type: choice
        options: [ubuntu-latest, ubuntu-latest-16-cores]
        default: ubuntu-latest
      writer_runs:
        description: grade only, using writer output from these run ids (space-separated)
        default: ""

permissions:
  actions: read # grade-only runs download writer artifacts from earlier runs
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - id: ids
        working-directory: eval
        env:
          STEP0_IDS: ${{ inputs.ids }}
        run: |
          ids="$STEP0_IDS"
          if [ -z "$ids" ]; then ids=$(bun src/tasks.ts ids tasks/tasks.json.gz); fi
          echo "ids=$ids" >> "$GITHUB_OUTPUT"

  write:
    needs: plan
    if: inputs.writer_runs == ''
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: bash eval/scripts/free-disk.sh
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.281
      - name: Task file without gold data
        working-directory: eval
        run: |
          bun src/tasks.ts strip tasks/tasks.json.gz tasks/public.json
          rm tasks/tasks.json.gz
      - name: Write tests
        working-directory: eval
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          STEP0_ID: ${{ matrix.id }}
          STEP0_MODEL: ${{ inputs.model }}
          STEP0_PROMPT: ${{ inputs.prompt }}
          STEP0_RUNNER: ${{ inputs.runner }}
        run: bun src/write.ts --tasks tasks/public.json --id "$STEP0_ID" --out results --model "$STEP0_MODEL" --prompt "$STEP0_PROMPT"
      - name: Upload writer output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: write-${{ matrix.id }}
          path: eval/results/
          if-no-files-found: warn

  grade:
    needs: [plan, write]
    if: always() && needs.plan.result == 'success'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: bash eval/scripts/free-disk.sh
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/download-artifact@v4
        if: inputs.writer_runs == ''
        continue-on-error: true # a crashed writer job uploads nothing; there is nothing to grade then
        with:
          name: write-${{ matrix.id }}
          path: eval/results/
      - name: Writer output from earlier runs
        if: inputs.writer_runs != ''
        env:
          GH_TOKEN: ${{ github.token }}
          STEP0_RUNS: ${{ inputs.writer_runs }}
          STEP0_ID: ${{ matrix.id }}
        run: |
          for run in $STEP0_RUNS; do
            echo "trying run $run"
            if gh run download "$run" -R "$GITHUB_REPOSITORY" -n "write-$STEP0_ID" -D eval/results/; then exit 0; fi
          done
          echo "no writer output in: $STEP0_RUNS"; exit 1
      - name: Grade
        working-directory: eval
        env:
          STEP0_ID: ${{ matrix.id }}
          STEP0_MUTANTS: ${{ inputs.mutants }}
          STEP0_RUNNER: ${{ inputs.runner }}
        run: |
          if [ ! -f "results/$STEP0_ID/write.json" ] && [ ! -f "results/$STEP0_ID/report.json" ]; then echo "no writer output"; exit 1; fi
          flags=()
          if [ "$STEP0_MUTANTS" = "true" ]; then flags+=(--mutants); fi
          bun src/grade.ts --tasks tasks/tasks.json.gz --id "$STEP0_ID" --results results "${flags[@]}"
      - name: Upload graded run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graded-${{ matrix.id }}
          path: eval/results/
          if-no-files-found: warn

  summarize:
    needs: [plan, grade]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/download-artifact@v4
        with:
          pattern: graded-*
          merge-multiple: true
          path: eval/results/
      - name: Catch rate
        working-directory: eval
        run: bun src/summarize.ts results | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: step0-results
          path: eval/results/
